name: Update M3U Scraper - Chuối Chiên TV

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # ĐÃ XÓA DÒNG cache: 'pip' Ở ĐÂY ĐỂ TRÁNH LỖI THIẾU requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow

      - name: Set REPO_RAW environment variable
        run: |
          echo "REPO_RAW=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          if git diff --staged --quiet; then
            echo "✅ Không có thay đổi mới, bỏ qua commit."
          else
            git commit -m "chore: update m3u, thumbs & output.json [skip ci]"
            git push
            echo "✅ Đã commit và push thành công!"
          fi

      - name: Show summary
        if: always()
        run: |
          echo "## 📊 Kết quả chạy" >> $GITHUB_STEP_SUMMARY
          echo "- Thời gian: $(date '+%H:%M %d/%m/%Y')" >> $GITHUB_STEP_SUMMARY
          if [ -f output.json ]; then
            echo "- Output: ✅ Đã tạo" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Output: ❌ Không có" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -d thumbs ]; then
            echo "- Thumbnails: $(ls thumbs/*.png 2>/dev/null | wc -l) files" >> $GITHUB_STEP_SUMMARY
          fi
